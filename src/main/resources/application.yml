spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springlab}
    username: ${DB_USER:springlab}
    password: ${DB_PASSWORD:springlab}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Lab 9: accounts/audit_log belong to Flyway; Hibernate create-drop must not touch them.
      hibernate.hbm2ddl.schema_filter_provider: kz.iitu.springlab.bank.FlywayOwnedTables
  flyway:
    locations: classpath:db/migration
    # The lab 8 database already contains Hibernate tables; baseline at 0 so V1 is still applied.
    baseline-on-migrate: true
    baseline-version: 0
  application:
    name: spring-lab-01

server:
  port: 8080

app:
  owner: Ushuzov Ruslan, IT1-2404IS
  group: IT1-2404IS
  date-pattern: yyyy-MM-dd HH:mm:ss
  repeating-times: 3
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  cache:
    ttl: 10m
    max-entries: 1000

logging:
  level:
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
