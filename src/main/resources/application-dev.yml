server:
  port: 8081

app:
  mail:
    enabled: false
    retry-count: 1
  cache:
    ttl: 1m
    max-entries: 100

logging:
  level:
    kz.iitu: DEBUG

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.generate_statistics: true
