<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.title}">Book</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<h1 th:text="${book.title}">Book</h1>
<table>
    <tr><th>#</th><th>Title</th><th>Author</th><th>Year</th></tr>
    <tr>
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author != null ? book.author.name : ''}">Author</td>
        <td th:text="${book.year}">2020</td>
    </tr>
</table>
<p><a th:href="@{/books}">Back</a></p>
</body>
</html>
